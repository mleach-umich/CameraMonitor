services:
  webcam-monitor:
    build: .
    container_name: webcam-monitor
    restart: unless-stopped
    volumes:
      # Log and chart files persist here on the host
      - ./data:/data
    environment:
      - TZ=America/Detroit
      - STREAM_URL=${STREAM_URL:-https://558312d54930d.streamlock.net/live/umci.fois.axis.stream/playlist.m3u8}
      - CAMERA_LATITUDE=${CAMERA_LATITUDE:-42.325}
      - CAMERA_LONGITUDE=${CAMERA_LONGITUDE:--83.05}
      - CAMERA_TIMEZONE=${CAMERA_TIMEZONE:-America/New_York}
      - MEASUREMENT_SCHEDULE_MODE=${MEASUREMENT_SCHEDULE_MODE:-cadence}
      - MEASUREMENT_CADENCE_MINUTES=${MEASUREMENT_CADENCE_MINUTES:-15}
      - MEASUREMENT_FIXED_TIMES=${MEASUREMENT_FIXED_TIMES:-}
      - CHECK_TARGET_SECOND=${CHECK_TARGET_SECOND:-50}
      - CAMERA_TRANSITION_GRACE_MINUTES=${CAMERA_TRANSITION_GRACE_MINUTES:-15}
      - NO_POWER_ALERT_THRESHOLD_FRACTION=${NO_POWER_ALERT_THRESHOLD_FRACTION:-0.33}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID:-}
      - SLACK_REPORT_NAME=${SLACK_REPORT_NAME:-UMCI Camera Monitor}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_TO=${EMAIL_TO:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - LAMBDA_WEBHOOK_URL=${LAMBDA_WEBHOOK_URL:-https://khgcza01c8.execute-api.us-east-1.amazonaws.com/Prod/webhook}
      - FFMPEG_TIMEOUT_SECONDS=${FFMPEG_TIMEOUT_SECONDS:-20}
      - STREAM_CHECK_TIMEOUT_SECONDS=${STREAM_CHECK_TIMEOUT_SECONDS:-10}
      - STREAM_CHECK_RETRIES=${STREAM_CHECK_RETRIES:-2}
      - STREAM_CHECK_RETRY_DELAY_SECONDS=${STREAM_CHECK_RETRY_DELAY_SECONDS:-2.0}
      - RED_PIXEL_RATIO=${RED_PIXEL_RATIO:-0.005}

  webcam-monitor-files:
    image: caddy:2-alpine
    container_name: webcam-monitor-files
    restart: unless-stopped
    depends_on:
      - webcam-monitor
    ports:
      - "8443:8443"
    volumes:
      - ./data:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
