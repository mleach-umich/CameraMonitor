services:
  webcam-monitor:
    build: .
    container_name: webcam-monitor
    restart: unless-stopped
    user: "${LOCAL_UID:-0}:${LOCAL_GID:-0}"
    volumes:
      # Log and chart files persist here on the host
      - ${HOST_DATA_DIR:-./data}:/data
    env_file:
      - path: .env.shared
        required: false
      - path: .env.secret
        required: false
    environment:
      - TZ=${TZ:-America/Detroit}

  webcam-monitor-files:
    image: caddy:2-alpine
    container_name: webcam-monitor-files
    restart: unless-stopped
    depends_on:
      - webcam-monitor
    ports:
      - "8443:8443"
    volumes:
      - ${HOST_DATA_DIR:-./data}:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
